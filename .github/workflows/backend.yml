name: Deploy backend (Supabase migrations and Edge Functions)

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "chat/js/miniapps/ddz-rules.js"
      - "agent/*.md"
      - "agent/gen-persona.py"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Check secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::缺少仓库 secret SUPABASE_DB_URL（Supabase 的 Session pooler 连接串）"
            exit 1
          fi

      - name: Preview migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --remote="$SUPABASE_DB_URL" --skip-vault --dry-run

      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --remote="$SUPABASE_DB_URL" --skip-vault --yes

  functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    # 先迁移再部署函数：函数依赖新的表
    needs: migrate
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Check secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::缺少仓库 secret SUPABASE_ACCESS_TOKEN（Supabase 账号设置里生成的 access token）"
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::缺少仓库 secret SUPABASE_PROJECT_REF（Supabase 项目的 Reference ID）"
            exit 1
          fi

      - name: Deploy send-push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy send-push --remote="$SUPABASE_PROJECT_REF" --yes

      # 沈剑心：人设 agent/persona.md 是唯一真相来源，部署前重新生成 persona.gen.ts（Edge Function 只会打包 supabase/functions 里的文件）
      - name: Generate agent persona module
        run: python3 agent/gen-persona.py

      # 密钥只放在环境变量里，不回显。没有 OPENAI_API_KEY 时只警告：函数照常部署，沈剑心会显示「还没接通」
      - name: Set agent secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::缺少仓库 secret OPENAI_API_KEY，沈剑心暂时无法回复（聊天里会显示「沈剑心还没接通」）"
          else
            supabase secrets set --remote="$SUPABASE_PROJECT_REF" --yes "OPENAI_API_KEY=$OPENAI_API_KEY" "OPENAI_MODEL=${OPENAI_MODEL:-gpt-6-luna}" > /dev/null
            echo "agent secrets updated"
          fi

      - name: Deploy agent-chat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy agent-chat --remote="$SUPABASE_PROJECT_REF" --yes

      # 斗地主：规则引擎 chat/js/miniapps/ddz-rules.js 是唯一真相来源，部署前重新生成 rules.gen.js
      - name: Generate DDZ rules module
        run: python3 supabase/functions/ddz/gen-rules.py

      - name: Deploy ddz
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy ddz --remote="$SUPABASE_PROJECT_REF" --yes
